[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-engine"
version = "0.1.0"
description = "Event-driven signal engine and simulator for short-duration prediction markets (template)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ['tzdata; platform_system == "Windows"']

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pmbot-sim = "pmbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmbot = ["demo/page.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "ASYNC", "RUF", "I"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["pmbot"]
known-local-folder = ["helpers"]
